name: Publish MinIO image

# Publishing is tag driven: create a tag named yyyymmddhhmm (UTC) on the s3s
# branch and push it. workflow_dispatch rebuilds the same source (for example to
# pick up base image updates) and labels the image with the current UTC minute.
on:
  workflow_dispatch:
  push:
    tags:
      - '*'

env:
  REGISTRY_IMAGE: ghcr.io/s3s-project/minio

jobs:
  # Any tag fires this workflow, and the fork also carries upstream's RELEASE.*
  # tags, so gate on the s3s build files and on the publish tag shape.
  guard:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      image_tag: ${{ steps.check.outputs.image_tag }}
      source_ref: ${{ steps.check.outputs.source_ref }}
      ldflags: ${{ steps.check.outputs.ldflags }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pinned upstream commit is an ancestor of the tagged commit, so the
          # metadata derived below has to be reachable from the checkout.
          fetch-depth: 0
      - name: Validate the ref and derive the build metadata
        id: check
        run: |
          set -euo pipefail

          if [ ! -f Dockerfile.s3s ]; then
            echo "::notice::$GITHUB_REF_NAME does not point at the s3s branch; nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ] && ! printf '%s' "$GITHUB_REF_NAME" | grep -qE '^[0-9]{12}$'; then
            echo "::notice::tag $GITHUB_REF_NAME is not a yyyymmddhhmm publish tag; skipping"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ref="$(cat .minio-source-ref)"
          if ! git merge-base --is-ancestor "$ref" HEAD; then
            echo "::error::.minio-source-ref ($ref) is not an ancestor of $GITHUB_SHA"
            exit 1
          fi
          commit="$(git rev-parse "$ref")"

          # Reproduces what upstream buildscripts/gen-ldflags.go emits when run at
          # the pinned commit, so the binary reports its upstream source identity
          # instead of this branch's own commit.
          version="$(TZ=UTC git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd "$commit")"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            image_tag="$GITHUB_REF_NAME"
          else
            image_tag="$(date -u +%Y%m%d%H%M)"
          fi

          {
            echo "build=true"
            echo "image_tag=$image_tag"
            echo "source_ref=$commit"
            echo "ldflags=-s -w -X github.com/minio/minio/cmd.Version=$version -X github.com/minio/minio/cmd.CopyrightYear=${version%%-*} -X github.com/minio/minio/cmd.ReleaseTag=DEVELOPMENT.${version//:/-} -X github.com/minio/minio/cmd.CommitID=$commit -X github.com/minio/minio/cmd.ShortCommitID=${commit:0:12}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [guard]
    if: needs.guard.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners build one platform each (no QEMU emulation).
          - platform: linux/amd64
            runs-on: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.s3s
          platforms: ${{ matrix.platform }}
          build-args: |
            LDFLAGS=${{ needs.guard.outputs.ldflags }}
            MINIO_SOURCE_REF=${{ needs.guard.outputs.source_ref }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=minio-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=minio-${{ env.PLATFORM_PAIR }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [guard, build]
    if: needs.guard.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_TAG: ${{ needs.guard.outputs.image_tag }}
        run: |
          docker buildx imagetools create \
            -t "$REGISTRY_IMAGE:$IMAGE_TAG" \
            -t "$REGISTRY_IMAGE:edge" \
            $(printf "$REGISTRY_IMAGE@sha256:%s " *)
      - name: Inspect
        env:
          IMAGE_TAG: ${{ needs.guard.outputs.image_tag }}
        run: docker buildx imagetools inspect "$REGISTRY_IMAGE:$IMAGE_TAG"
